<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>賽跑控制器</title>
  <!-- 禁止縮放，營造全螢幕搖桿感 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #101820; color: #fff; overflow: hidden;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      /* 防止雙擊縮放、長按選字、點擊閃藍色 */
      touch-action: manipulation; -webkit-text-size-adjust: 100%; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 20px; }
    .hidden { display: none !important; }

    /* 加入畫面 */
    #joinScreen { justify-content: center; gap: 16px; }
    #joinScreen h1 { text-align: center; margin: 0 0 10px; font-size: 32px; }
    #joinScreen input { font-size: 28px; padding: 16px; border-radius: 12px; border: 0; text-align: center;
      user-select: text; -webkit-user-select: text; }
    #joinBtn { font-size: 30px; padding: 18px; border: 0; border-radius: 12px; background: #22c55e; color: #052e14; font-weight: bold; }
    #photoBtn { align-self: center; width: 120px; height: 120px; border-radius: 50%; border: 4px dashed #64748b;
      background: #1e293b center / cover no-repeat; color: #94a3b8; font-size: 16px; padding: 0; line-height: 1.3; }
    #photoBtn.has { border: 4px solid #fff; color: transparent; }
    #joinError { color: #f87171; text-align: center; min-height: 24px; }

    /* 選角色 / 選顏色：上方大圖，下方一排小方格（角色頭）或顏色 */
    #pickScreen { padding: 14px; gap: 10px; }
    #pickTitle { text-align: center; font-size: 26px; font-weight: bold; }
    #bigArt { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    #bigArt img, #bigArt canvas { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 14px; }
    #pickMsg { text-align: center; color: #f87171; min-height: 20px; }
    #pickGrid { display: grid; gap: 10px; }
    /* 角色一排可以左右滑動（超過 3 個半就會露出下一個，提示可以滑） */
    #pickGrid.chars { display: flex; overflow-x: auto; gap: 10px; scroll-snap-type: x proximity; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 2px; }
    #pickGrid.chars::-webkit-scrollbar { display: none; }
    #pickGrid.chars .charBtn { flex: 0 0 calc((100% - 30px) / 3.5); scroll-snap-align: center; }
    #pickGrid.colors { grid-template-columns: repeat(4, 1fr); }
    .charBtn { background: #1e293b; border: 4px solid #334155; border-radius: 14px; padding: 4px; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center; }
    .charBtn canvas { width: 100%; height: 100%; }
    .charBtn.sel { border-color: #fff; background: #334155; }
    .colorBtn { aspect-ratio: 1; border-radius: 50%; border: 4px solid #1e293b; font-size: 26px; color: #fff;
      display: flex; align-items: center; justify-content: center; padding: 0; }
    .colorBtn:active { border-color: #fff; }
    .colorBtn:disabled { opacity: .25; }
    #pickOk, #pickBack { font-size: 24px; padding: 14px; border: 0; border-radius: 12px; font-family: inherit; font-weight: bold; }
    #pickOk { background: #22c55e; color: #052e14; }
    #pickBack { background: #334155; color: #fff; }

    /* 遊戲畫面：上方一行文字、下方是大按鈕（等待時一顆、比賽時左右兩顆） */
    #playScreen { padding: 0; }
    #msg { text-align: center; font-size: 26px; padding: 18px 12px; min-height: 100px;
      display: flex; align-items: center; justify-content: center; line-height: 1.4; }
    #repickBtn { align-self: center; font-size: 20px; padding: 10px 24px; border: 0; border-radius: 12px;
      background: #334155; color: #fff; font-family: inherit; margin-bottom: 8px; }
    .dot { display: inline-block; width: 1em; height: 1em; border-radius: 50%; vertical-align: -2px; border: 2px solid #fff; }
    #bigBtn, #pad button { border: 0; border-radius: 28px; font-weight: bold; color: #fff; background: var(--c, #3b82f6);
      font-family: inherit; transition: transform .05s, filter .05s; touch-action: none; }
    #bigBtn { flex: 1; margin: 0 16px 24px; font-size: 56px; }
    #pad { flex: 1; display: flex; gap: 12px; margin: 0 12px 24px; }
    #pad button { flex: 1; font-size: 64px; opacity: .75; }
    #pad button.next { opacity: 1; box-shadow: 0 0 0 6px rgba(255, 255, 255, .55) inset; }
    #pad button.pressed, #bigBtn.pressed { transform: scale(.95); filter: brightness(1.5); }   /* 按下時的視覺回饋 */
    /* 足球：整塊都是浮動搖桿（手指按在哪裡，搖桿就出現在哪裡） */
    #soccerPad { flex: 1; display: flex; gap: 12px; margin: 0 12px 24px; }
    #stickZone { flex: 1.5; border-radius: 28px; background: #16222e; position: relative; overflow: hidden; touch-action: none; }
    #actions { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    #actions button { flex: 1; border: 0; border-radius: 28px; font-size: 34px; font-weight: bold; color: #fff; background: var(--c, #3b82f6);
      font-family: inherit; touch-action: none; line-height: 1.3; }
    #actions button small { display: block; font-size: 16px; font-weight: normal; opacity: .85; }
    #btnNeck { flex: 1.6; border-radius: 28px; background: var(--c, #3b82f6); color: #fff; position: relative; overflow: hidden;
      touch-action: none; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 34px; font-weight: bold; line-height: 1.3; }
    #neckLabel { pointer-events: none; }
    #neckLabel small { display: block; font-size: 15px; font-weight: normal; opacity: .9; margin-top: 4px; }
    #aimBase { position: absolute; width: 130px; height: 130px; border-radius: 50%; border: 4px solid rgba(255,255,255,.7); background: rgba(0,0,0,.18);
      transform: translate(-50%, -50%); pointer-events: none; }
    #aimKnob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); }
    #btnNeck.pressed { filter: brightness(1.25); }
    #soccerPad.solo #btnNeck { display: none; }              /* 陀螺大戰只有「衝撞」鈕（共用衝刺那顆） */
    #actions button.cooling { filter: grayscale(.8) brightness(.6); }
    /* 陀螺大戰：準備（請求體感授權）與傾斜操控畫面 */
    #readyPad { flex: 1; display: flex; flex-direction: column; gap: 14px; margin: 0 16px 24px; justify-content: center; }
    #readyPad button { border: 0; border-radius: 24px; font-family: inherit; font-weight: bold; color: #fff; background: var(--c, #3b82f6); }
    #btnReadyGyro { flex: 2; font-size: 34px; line-height: 1.4; }
    #btnReadyStick { flex: 1; font-size: 26px; background: #334155 !important; }
    #gyroPad { flex: 1; display: flex; flex-direction: column; gap: 12px; margin: 0 16px 24px; }
    #tiltBox { flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 28px; background: #16222e; position: relative; }
    #tiltRing { width: 78%; max-width: 300px; aspect-ratio: 1; border-radius: 50%; border: 4px solid rgba(255,255,255,.35); position: relative;
      background: radial-gradient(circle, rgba(255,255,255,.12) 0, rgba(255,255,255,.04) 60%, transparent 62%); }
    #tiltRing::before, #tiltRing::after { content: ''; position: absolute; background: rgba(255,255,255,.18); }
    #tiltRing::before { left: 50%; top: 8%; bottom: 8%; width: 2px; }
    #tiltRing::after { top: 50%; left: 8%; right: 8%; height: 2px; }
    #tiltBubble { position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1; border-radius: 50%; background: var(--c, #3b82f6);
      border: 4px solid #fff; transform: translate(-50%, -50%); }
    #btnRamGyro { border: 0; border-radius: 24px; padding: 26px 0; font-size: 34px; font-weight: bold; font-family: inherit; color: #fff; background: var(--c, #3b82f6); touch-action: none; }
    #btnRamGyro.pressed { transform: scale(.97); filter: brightness(1.5); }
    #btnRamGyro.cooling { filter: grayscale(.8) brightness(.6); }
    #gyroBtns { display: flex; gap: 12px; }
    #gyroBtns button { flex: 1; border: 0; border-radius: 18px; padding: 18px 0; font-size: 24px; font-weight: bold; font-family: inherit; color: #fff; background: #334155; }   /* 陀螺大戰：只有搖桿，沒有頭槌／衝刺 */
    #actions button.pressed { transform: scale(.95); filter: brightness(1.5); }
    #stickHint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #4b6075;
      font-size: 28px; pointer-events: none; }
    #stickBase { position: absolute; width: 150px; height: 150px; border-radius: 50%; border: 4px solid rgba(255,255,255,.45);
      background: rgba(255,255,255,.08); transform: translate(-50%, -50%); pointer-events: none; }
    #stickKnob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; border-radius: 50%; background: var(--c, #3b82f6);
      border: 4px solid #fff; transform: translate(-50%, -50%); }
    #bigBtn:disabled { background: #3a4a5a; color: #7b8a99; }
  </style>
</head>
<body>
  <!-- 加入畫面 -->
  <div id="joinScreen" class="screen">
    <h1>🏃 大頭賽跑</h1>
    <button id="photoBtn" type="button">📷<br>拍大頭照</button>
    <input id="photoInput" type="file" accept="image/*" capture="user" class="hidden">
    <input id="roomInput" inputmode="numeric" maxlength="4" placeholder="房號（4 位數）">
    <input id="nameInput" maxlength="10" placeholder="你的暱稱">
    <button id="joinBtn">加入</button>
    <div id="joinError"></div>
  </div>

  <!-- 選角色、選衣服顏色 -->
  <div id="pickScreen" class="screen hidden">
    <div id="pickTitle"></div>
    <div id="bigArt"></div>
    <div id="pickMsg"></div>
    <div id="pickGrid"></div>
    <button id="pickOk">選這個角色</button>
    <button id="pickBack" class="hidden">← 重選角色</button>
  </div>

  <!-- 遊戲畫面 -->
  <div id="playScreen" class="screen hidden">
    <div id="msg"></div>
    <button id="repickBtn" class="hidden">改角色 / 顏色</button>
    <button id="bigBtn" disabled>等待中</button>
    <div id="soccerPad" class="hidden">
      <div id="stickZone">
        <div id="stickHint">按住這裡拖動<br>往想去的方向跑</div>
        <div id="stickBase" class="hidden"><div id="stickKnob"></div></div>
      </div>
      <div id="actions">
        <div id="btnNeck">
          <div id="neckLabel">頭槌<small>按住蓄力、往想打的方向滑<br>放開打出去</small></div>
          <div id="aimBase" class="hidden"><div id="aimKnob"></div></div>
        </div>
        <button id="btnDash">衝刺</button>
      </div>
    </div>
    <div id="readyPad" class="hidden">
      <button id="btnReadyGyro">📱 準備好<br><small style="font-size:18px;font-weight:normal">用手機傾斜操控</small></button>
      <button id="btnReadyStick">🕹 改用搖桿</button>
    </div>
    <div id="gyroPad" class="hidden">
      <div id="tiltBox"><div id="tiltRing"><div id="tiltBubble"></div></div></div>
      <button id="btnRamGyro">衝撞</button>
      <div id="gyroBtns"><button id="btnCalib">校正（現在的姿勢當水平）</button><button id="btnToStick">改用搖桿</button></div>
    </div>
    <div id="pad" class="hidden">
      <button id="btnL">左</button>
      <button id="btnR">右</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="characters.js"></script>
  <script src="controller.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>運動會 - 主畫面</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; background: #101820; overflow: hidden;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; color: #fff; }
    #game { position: fixed; inset: 0; }

    /* 蓋在 Phaser 畫面上的面板（大廳、每組結果、總成績） */
    .panel { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: rgba(16, 24, 32, .92);
      text-align: center; padding: 20px; box-sizing: border-box; }
    .panel.hidden { display: none; }
    h1 { font-size: 48px; margin: 0 0 20px; }
    h2 { font-size: 28px; margin: 0 0 10px; }

    /* 遊戲大廳：標題 + 左右兩欄（左：選遊戲，右：加入的玩家） */
    #lobby { justify-content: flex-start; padding: 28px 48px 32px; overflow-y: auto; }   /* 內容比螢幕高時，整個大廳可以上下捲動 */
    #lobby h1 { font-size: 56px; margin: 0 0 22px; letter-spacing: 2px; }
    .hub { flex: 1 0 auto; min-height: 0; width: 100%; max-width: 1200px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; }
    .col { background: #16222e; border-radius: 20px; padding: 22px 26px; display: flex; flex-direction: column;
      min-height: 0; text-align: left; }
    .col h2 { font-size: 26px; margin: 0 0 14px; color: #cfe0f1; }

    /* 左欄：遊戲卡片 */
    #gameList { flex: 1; display: flex; flex-direction: column; gap: 14px; }
    .game-card { display: flex; align-items: center; gap: 20px; padding: 16px 22px; border-radius: 16px; cursor: pointer;
      background: #1f3347; border: 4px solid transparent; }
    .game-card:hover { background: #26405a; }
    .game-card.sel { border-color: #22c55e; background: #26405a; }
    .game-card.off { opacity: .55; cursor: not-allowed; }
    .game-card .icon { font-size: 54px; line-height: 1; }
    .game-card .name { font-size: 34px; font-weight: bold; }
    .game-card .desc { font-size: 18px; color: #9fb3c8; margin-top: 4px; }
    .game-card .badge { margin-left: auto; font-size: 16px; padding: 4px 12px; border-radius: 12px; background: #3a4a5a; color: #cbd5e1; white-space: nowrap; }
    .game-foot { margin-top: 16px; display: flex; align-items: center; gap: 20px; }
    .game-foot button { flex: none; white-space: nowrap; padding: 14px 40px; }
    .hint { color: #9fb3c8; min-height: 22px; font-size: 18px; }

    /* 右欄：加入方式 + 玩家列表 */
    .join { display: flex; align-items: center; gap: 20px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 2px solid #26405a; }
    .qr-box { background: #fff; color: #111; padding: 8px; border-radius: 10px; }
    #qrcode { display: flex; justify-content: center; }
    .room { font-size: 22px; color: #cfe0f1; }
    .room b { font-size: 48px; letter-spacing: 6px; color: #fff; display: block; }
    .url { font-size: 12px; color: #8aa0b5; word-break: break-all; margin-top: 4px; max-width: 260px; }
    #playerList { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      align-content: start; overflow-y: auto; }
    #playerList li { background: #1f3347; padding: 6px 12px; border-radius: 14px; font-size: 20px; line-height: 1.2; display: flex; align-items: center; gap: 10px; }
    #playerList li small { color: #9fb3c8; font-size: 14px; }
    #playerList .av { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: top; background: #0f1a24;
      flex: none; border: 3px solid var(--c, #888); }
    #playerList .empty { grid-column: 1 / -1; color: #7b8a99; font-size: 20px; background: none; }

    button { font-size: 28px; padding: 14px 48px; border: 0; border-radius: 14px; cursor: pointer;
      background: #22c55e; color: #052e14; font-weight: bold; font-family: inherit; }
    button.hidden { display: none; }
    button:disabled { background: #3a4a5a; color: #7b8a99; cursor: not-allowed; }

    ol.rank { list-style: none; padding: 0; margin: 0 0 20px; font-size: 30px; text-align: left; min-width: 420px; }
    ol.rank li { display: flex; justify-content: space-between; gap: 40px; padding: 8px 18px;
      background: #1f3347; margin-bottom: 8px; border-radius: 10px; }
    ol.rank li .dnf { color: #f87171; }
    /* 人多（超過 6 筆）時改成兩欄、字小一點，結算畫面才放得下，按鈕不會被擠出螢幕 */
    ol.rank.many { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; font-size: 22px; min-width: 780px; }
    ol.rank.many li { margin: 0; padding: 6px 14px; gap: 16px; }
    .next-info { font-size: 22px; color: #9fb3c8; margin-bottom: 20px; }

    /* 右上角小提示：目前第幾組 */
    #homeBtn { position: fixed; top: 12px; right: 16px; font-size: 18px; padding: 8px 18px; border-radius: 10px; background: #334155; color: #fff; z-index: 5; }
    #hud { position: fixed; top: 14px; left: 20px; font-size: 28px; font-weight: bold; pointer-events: none; }
    #singVideo { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); height: 66vh; max-width: 40vw; z-index: 25; border-radius: 16px;
      box-shadow: 0 0 0 5px #fde68a, 0 8px 40px rgba(0, 0, 0, .7); background: #000; object-fit: cover; }
    #singVideo.hidden { display: none; }
    /* 計分條（遊戲結束時出現在畫面下方）與累計排名 */
    #scoreBar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 35; display: flex; align-items: center; gap: 14px; max-width: 94vw;
      background: rgba(15, 23, 42, .95); border: 3px solid #f59e0b; border-radius: 16px; padding: 10px 18px; font-size: 22px; }
    #scoreBar.hidden { display: none; }
    #scoreBar button { font-size: 22px; padding: 8px 22px; white-space: nowrap; }
    #scoreNo { background: #475569; color: #fff; }
    #standList { list-style: none; padding: 0; margin: 0 0 18px; width: 100%; max-width: 980px; max-height: 62vh; overflow-y: auto; text-align: left; }
    #standList li { display: grid; grid-template-columns: 56px 220px 110px 1fr; align-items: center; gap: 10px; background: #1f3347; border-left: 8px solid var(--c, #888);
      border-radius: 12px; padding: 8px 14px; margin-bottom: 8px; font-size: 26px; }
    #standList .no { font-size: 30px; text-align: center; }
    #standList .tot { font-weight: bold; color: #fde68a; text-align: right; }
    #standList .dt { display: flex; flex-wrap: wrap; gap: 6px; font-size: 15px; color: #9fb3c8; }
    #standList .gp { background: #14222f; padding: 2px 9px; border-radius: 8px; }
    #standList .gp b { color: #fff; }
    #standList .empty { display: block; text-align: center; color: #7b8a99; background: none; }
    /* 猜猜他是誰 */
    .quiz { justify-content: flex-start; padding: 16px 28px 64px; gap: 12px; z-index: 3; }
    .quiz .hidden { display: none !important; }
    #qTop { width: 100%; max-width: 1180px; display: flex; align-items: center; gap: 18px; font-size: 30px; font-weight: bold; }
    #qTimer { flex: 1; height: 18px; border-radius: 9px; background: #26405a; overflow: hidden; }
    #qBar { display: block; height: 100%; width: 100%; background: #22c55e; transition: width .1s linear, background .3s; }
    #qBar.low { background: #ef4444; }
    #qSec { width: 2.2em; text-align: right; }
    #qStage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
    #qImgBox { position: relative; height: 100%; max-width: 100%; aspect-ratio: auto; display: flex; }
    #qImgBox img { max-height: 100%; max-width: 100%; display: block; border-radius: 14px; }
    #qImgBox #qMask { position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; object-fit: fill; pointer-events: none; }
    #qBanner { position: absolute; left: 0; right: 0; bottom: 14px; margin: 0 auto; width: fit-content; max-width: 90%; padding: 8px 26px; border-radius: 14px;
      background: rgba(0, 0, 0, .72); font-size: 40px; font-weight: bold; opacity: 0; transition: opacity .3s; }
    #qBanner.show { opacity: 1; }
    #qOpts { width: 100%; max-width: 1180px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .qo { background: var(--c); border-radius: 16px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 26px; transition: opacity .3s, transform .3s; }
    .qo .sh { font-size: 34px; line-height: 1; }
    .qo b { font-size: 36px; }
    .qo .cnt { font-size: 22px; opacity: .9; }
    .qo.dim { opacity: .28; }
    .qo.right { transform: scale(1.06); box-shadow: 0 0 0 6px #fff; }
    #qBoard, #qResult { margin: auto; text-align: center; }
    #qBoard ol, #qResult ol { margin-left: auto; margin-right: auto; }
    #qBoardList em { color: #4ade80; font-style: normal; }
    /* 右下角：音效開關與音量；還沒解鎖（沒點過畫面）時會閃一下提醒 */
    .aibar { float: right; display: flex; gap: 8px; }
    .aibar button { font-size: 18px; padding: 6px 16px; background: #334155; color: #fff; border-radius: 10px; }
    .aibar select { font-size: 18px; padding: 4px 8px; border-radius: 10px; background: #334155; color: #fff; border: 0; font-family: inherit; }
    .aibar button:disabled { opacity: .4; }
    #sndBox { position: fixed; right: 16px; bottom: 12px; z-index: 20; display: flex; align-items: center; gap: 8px;
      background: rgba(16, 24, 32, .75); border-radius: 12px; padding: 4px 10px; }
    #sndBox button { font-size: 22px; padding: 2px 8px; background: none; color: #fff; border-radius: 8px; }
    #sndVol { width: 90px; accent-color: #22c55e; }
    #sndBox.locked { animation: sndPulse 1.4s infinite; }
    @keyframes sndPulse { 50% { box-shadow: 0 0 0 4px rgba(34, 197, 94, .6); } }
  </style>
</head>
<body>
  <div id="game"></div>
  <!-- 跑步：小肥「唱歌」技能發動時，在畫面右側播放的影片（播完才消失） -->
  <video id="singVideo" class="hidden" playsinline preload="auto"><source src="video/sing.mp4" type="video/mp4"><source src="video/sing.webm" type="video/webm"></video>
  <div id="hud"></div>
  <button id="homeBtn" class="hidden">回大廳</button>

  <!-- 遊戲大廳：左欄選遊戲、右欄是加入的玩家 -->
  <div id="lobby" class="panel">
    <h1>運動會</h1>
    <div class="hub">
      <section class="col">
        <h2>選擇遊戲</h2>
        <div id="gameList"></div>
        <div class="game-foot">
          <button id="startBtn" disabled>開始</button>
          <button id="standBtn" type="button" style="background:#f59e0b;color:#1f1300">🏆 結算排名</button>
          <div id="info" class="hint">用手機掃 QR Code 加入</div>
        </div>
      </section>
      <section class="col">
        <div class="join">
          <div class="qr-box"><div id="qrcode"></div></div>
          <div>
            <div class="room">房號 <b id="roomCode">----</b></div>
            <div id="url" class="url"></div>
          </div>
        </div>
        <h2>已加入 <span id="count">0</span> 人 <span class="aibar"><select id="aiLevel"><option value="easy">簡單</option><option value="normal">普通</option><option value="hard">困難</option></select><button id="aiAdd" type="button">＋ AI</button><button id="aiDel" type="button">－ AI</button></span></h2>
        <ul id="playerList"></ul>
      </section>
    </div>
  </div>

  <!-- 每一組跑完的結果 -->
  <div id="heatPanel" class="panel hidden">
    <h1 id="heatTitle"></h1>
    <ol id="heatList" class="rank"></ol>
    <div id="nextInfo" class="next-info"></div>
    <button id="nextBtn"></button>
  </div>

  <!-- 全部組別跑完的總成績 -->
  <div id="finalPanel" class="panel hidden">
    <h1>🏆 總成績</h1>
    <ol id="finalList" class="rank"></ol>
    <div style="display:flex;gap:20px;justify-content:center">
      <button id="againBtn">再來一場</button>
      <button id="lobbyBtn" style="background:#3b82f6;color:#fff">回遊戲大廳</button>
    </div>
  </div>

  <!-- 足球：比賽結束的結算 -->
  <div id="soccerPanel" class="panel hidden">
    <h1 id="soccerTitle"></h1>
    <div id="soccerScore" style="font-size:56px;font-weight:bold;margin-bottom:20px"></div>
    <ol id="soccerList" class="rank"></ol>
    <div style="display:flex;gap:20px;justify-content:center">
      <button id="soccerAgainBtn">再來一場</button>
      <button id="soccerLobbyBtn" style="background:#3b82f6;color:#fff">回遊戲大廳</button>
    </div>
  </div>

  <!-- 陀螺大戰：第 1 回合結束、最終結果 -->
  <div id="spinnerPanel" class="panel hidden">
    <h1 id="spinnerTitle"></h1>
    <div id="spinnerSub" style="font-size:26px;color:#fde68a;margin-bottom:18px"></div>
    <ol id="spinnerList" class="rank"></ol>
    <div style="display:flex;gap:20px;justify-content:center">
      <button id="spinnerNextBtn">開始第 2 回合</button>
      <button id="spinnerAgainBtn" class="hidden">再來一場</button>
      <button id="spinnerLobbyBtn" class="hidden" style="background:#3b82f6;color:#fff">回遊戲大廳</button>
    </div>
  </div>

  <!-- 猜猜他是誰：搶答 -->
  <div id="quizPanel" class="panel quiz hidden">
    <div id="qTop"><span id="qNum"></span><div id="qTimer"><i id="qBar"></i></div><span id="qSec"></span></div>
    <div id="qStage">
      <div id="qImgBox"><img id="qImg" alt=""><img id="qMask" alt=""><div id="qBanner"></div></div>
    </div>
    <div id="qOpts"></div>
    <div id="qBoard" class="hidden"><h1 id="qBoardTitle"></h1><ol id="qBoardList" class="rank"></ol></div>
    <div id="qResult" class="hidden"><h1>🏆 最終排名</h1><ol id="qResultList" class="rank"></ol>
      <div style="display:flex;gap:20px;justify-content:center"><button id="qAgainBtn">再來一場</button><button id="qLobbyBtn" style="background:#3b82f6;color:#fff">回遊戲大廳</button></div></div>
  </div>

  <!-- 計分：每個遊戲結束時主持人選擇 [計分] 或 [試玩不計分] -->
  <div id="scoreBar" class="hidden"><span id="scoreMsg"></span><button id="scoreYes">✔ 計分</button><button id="scoreNo">🎮 試玩不計分</button></div>
  <!-- 結算排名 -->
  <div id="standPanel" class="panel hidden" style="z-index:40">
    <h1>🏆 累計排名</h1>
    <div id="standNote" class="next-info"></div>
    <ol id="standList"></ol>
    <div style="display:flex;gap:20px;justify-content:center"><button id="standClose">關閉</button><button id="standReset" style="background:#475569;color:#fff">重新開始賽季</button></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="characters.js"></script>
  <script src="char-render.js"></script>
  <script src="audio.js"></script>
  <script src="host.js"></script>
  <script src="scoring.js"></script>
  <script src="ai.js"></script>
  <script src="games/race.js"></script>
  <script src="games/soccer.js"></script>
  <script src="games/spinner.js"></script>
  <script src="games/quiz.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Party Game - 主畫面</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; background: #101820; overflow: hidden;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; color: #fff; }
    #game { position: fixed; inset: 0; }

    /* 蓋在 Phaser 畫面上的面板（大廳、每組結果、總成績） */
    .panel { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: rgba(16, 24, 32, .92);
      text-align: center; padding: 20px; box-sizing: border-box; }
    .panel.hidden { display: none; }
    h1 { font-size: 48px; margin: 0 0 20px; }
    h2 { font-size: 28px; margin: 0 0 10px; }

    /* 遊戲大廳：標題 + 左右兩欄（左：選遊戲，右：加入的玩家） */
    #lobby { justify-content: flex-start; padding: 28px 48px 32px; }
    #lobby h1 { font-size: 56px; margin: 0 0 22px; letter-spacing: 2px; }
    .hub { flex: 1; min-height: 0; width: 100%; max-width: 1200px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; }
    .col { background: #16222e; border-radius: 20px; padding: 22px 26px; display: flex; flex-direction: column;
      min-height: 0; text-align: left; }
    .col h2 { font-size: 26px; margin: 0 0 14px; color: #cfe0f1; }

    /* 左欄：遊戲卡片 */
    #gameList { flex: 1; display: flex; flex-direction: column; gap: 14px; }
    .game-card { display: flex; align-items: center; gap: 20px; padding: 16px 22px; border-radius: 16px; cursor: pointer;
      background: #1f3347; border: 4px solid transparent; }
    .game-card:hover { background: #26405a; }
    .game-card.sel { border-color: #22c55e; background: #26405a; }
    .game-card.off { opacity: .55; cursor: not-allowed; }
    .game-card .icon { font-size: 54px; line-height: 1; }
    .game-card .name { font-size: 34px; font-weight: bold; }
    .game-card .desc { font-size: 18px; color: #9fb3c8; margin-top: 4px; }
    .game-card .badge { margin-left: auto; font-size: 16px; padding: 4px 12px; border-radius: 12px; background: #3a4a5a; color: #cbd5e1; white-space: nowrap; }
    .game-foot { margin-top: 16px; display: flex; align-items: center; gap: 20px; }
    .game-foot button { flex: none; white-space: nowrap; padding: 14px 40px; }
    .hint { color: #9fb3c8; min-height: 22px; font-size: 18px; }

    /* 右欄：加入方式 + 玩家列表 */
    .join { display: flex; align-items: center; gap: 20px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 2px solid #26405a; }
    .qr-box { background: #fff; color: #111; padding: 8px; border-radius: 10px; }
    #qrcode { display: flex; justify-content: center; }
    .room { font-size: 22px; color: #cfe0f1; }
    .room b { font-size: 48px; letter-spacing: 6px; color: #fff; display: block; }
    .url { font-size: 12px; color: #8aa0b5; word-break: break-all; margin-top: 4px; max-width: 260px; }
    #playerList { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      align-content: start; overflow-y: auto; }
    #playerList li { background: #1f3347; padding: 6px 12px; border-radius: 14px; font-size: 20px; line-height: 1.2; display: flex; align-items: center; gap: 10px; }
    #playerList li small { color: #9fb3c8; font-size: 14px; }
    #playerList .av { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: top; background: #0f1a24;
      flex: none; border: 3px solid var(--c, #888); }
    #playerList .empty { grid-column: 1 / -1; color: #7b8a99; font-size: 20px; background: none; }

    button { font-size: 28px; padding: 14px 48px; border: 0; border-radius: 14px; cursor: pointer;
      background: #22c55e; color: #052e14; font-weight: bold; font-family: inherit; }
    button:disabled { background: #3a4a5a; color: #7b8a99; cursor: not-allowed; }

    ol.rank { list-style: none; padding: 0; margin: 0 0 20px; font-size: 30px; text-align: left; min-width: 420px; }
    ol.rank li { display: flex; justify-content: space-between; gap: 40px; padding: 8px 18px;
      background: #1f3347; margin-bottom: 8px; border-radius: 10px; }
    ol.rank li .dnf { color: #f87171; }
    .next-info { font-size: 22px; color: #9fb3c8; margin-bottom: 20px; }

    /* 右上角小提示：目前第幾組 */
    #hud { position: fixed; top: 14px; left: 20px; font-size: 28px; font-weight: bold; pointer-events: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="hud"></div>

  <!-- 遊戲大廳：左欄選遊戲、右欄是加入的玩家 -->
  <div id="lobby" class="panel">
    <h1>🎉 Party Game</h1>
    <div class="hub">
      <section class="col">
        <h2>選擇遊戲</h2>
        <div id="gameList"></div>
        <div class="game-foot">
          <button id="startBtn" disabled>開始</button>
          <div id="info" class="hint">用手機掃 QR Code 加入</div>
        </div>
      </section>
      <section class="col">
        <div class="join">
          <div class="qr-box"><div id="qrcode"></div></div>
          <div>
            <div class="room">房號 <b id="roomCode">----</b></div>
            <div id="url" class="url"></div>
          </div>
        </div>
        <h2>已加入 <span id="count">0</span> 人</h2>
        <ul id="playerList"></ul>
      </section>
    </div>
  </div>

  <!-- 每一組跑完的結果 -->
  <div id="heatPanel" class="panel hidden">
    <h1 id="heatTitle"></h1>
    <ol id="heatList" class="rank"></ol>
    <div id="nextInfo" class="next-info"></div>
    <button id="nextBtn"></button>
  </div>

  <!-- 全部組別跑完的總成績 -->
  <div id="finalPanel" class="panel hidden">
    <h1>🏆 總成績</h1>
    <ol id="finalList" class="rank"></ol>
    <div style="display:flex;gap:20px;justify-content:center">
      <button id="againBtn">再來一場</button>
      <button id="lobbyBtn" style="background:#3b82f6;color:#fff">回遊戲大廳</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="characters.js"></script>
  <script src="char-render.js"></script>
  <script src="host.js"></script>
  <script src="games/race.js"></script>
</body>
</html>
